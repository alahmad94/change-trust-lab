name: CT Adjudicator Baseline

on:
  workflow_run:
    workflows: ["CT Executor Baseline"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  adjudicate:
    runs-on: ubuntu-latest
    steps:
      - name: Record trusted control-plane identity
        run: |
          echo "marker=ADJUDICATOR_APP_V2"
          echo "event=${{ github.event_name }}"
          echo "upstream_conclusion=${{ github.event.workflow_run.conclusion }}"
          echo "upstream_head_sha=${{ github.event.workflow_run.head_sha }}"
          echo "workflow_sha=${{ github.workflow_sha }}"
      - name: Assert no repository checkout
        run: |
          test ! -d .git
          echo "PASS: adjudicator did not checkout repository code"

      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CT_APP_ID }}
          private-key: ${{ secrets.CT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: change-trust-lab

      - name: Publish app-authored verdict check
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          repo = os.environ['REPO']
          sha = os.environ['TARGET_SHA']
          token = os.environ['GH_TOKEN']
          body = json.dumps({
              'name': 'change-trust/verdict',
              'head_sha': sha,
              'status': 'completed',
              'conclusion': 'success',
              'output': {
                  'title': 'Change Trust experimental verdict',
                  'summary': 'Experiment B: verdict posted by the dedicated GitHub App.'
              }
          }).encode()
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/check-runs',
              data=body,
              method='POST',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json'
              }
          )
          with urllib.request.urlopen(req) as r:
              result = json.load(r)
          print('check_name=' + result['name'])
          print('check_app=' + result['app']['slug'])
          print('check_sha=' + result['head_sha'])
          print('check_conclusion=' + result['conclusion'])
          PY
